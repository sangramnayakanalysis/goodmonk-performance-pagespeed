name: GoodMonk Customer Journey Monitor

# Independent of monitor.yml (the PageSpeed workflow) — different
# script (journey.py), different files committed
# (dashboard/data/journey.json, data/journey_runs.json,
# dashboard/data/journey_captures/*), different cadence. Both workflows
# share the "pages" concurrency group below so their Pages deployments
# queue instead of racing each other; monitor.yml itself is untouched.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  journey-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (Chromium only)
        run: python -m playwright install --with-deps chromium

      - name: Run Customer Journey monitor
        id: run
        env:
          GOOGLE_PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        continue-on-error: true
        run: python journey.py

      - name: Report run outcome
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "✅ Customer Journey monitor completed."
          else
            echo "⚠️ Customer Journey monitor finished with errors — see logs above."
          fi

      - name: Commit journey data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the entire generated-data directories, same reasoning
          # as monitor.yml — see that file's comment for the incident
          # this pattern fixes. Any future module writing a new file
          # under dashboard/data/ or data/ is covered automatically.
          git add dashboard/data data

          if git diff --cached --quiet; then
            echo "No journey data changes to commit."
            exit 0
          fi

          git commit -m "chore: update customer journey data [skip ci]"

          # Belt-and-suspenders — see monitor.yml's identical check.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree still dirty after commit — rebase would fail. Dirty path(s):"
            git status --porcelain
            echo "::error::Fix: widen the 'git add' above to cover whatever path is generating this file."
            exit 1
          fi

          # Same rebase-retry pattern as monitor.yml (this workflow never
          # edits monitor.yml, but the underlying git race is identical —
          # two workflows pushing to main concurrently). Journey files are
          # fully regenerated/appended each run, so "this run's version
          # wins" is the correct merge strategy here too.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main -X theirs; then
              echo "Rebase succeeded on attempt $attempt."
              break
            fi
            echo "Rebase attempt $attempt failed — aborting and retrying."
            git rebase --abort || true
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not rebase onto origin/main after 5 attempts — not pushing."
              exit 1
            fi
            sleep $((RANDOM % 10 + 5))
          done

          # Same safety gate as monitor.yml: never push invalid JSON.
          python3 -c "
          import json, sys
          from pathlib import Path
          bad = []
          for f in Path('dashboard/data').rglob('*.json'):
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  bad.append(f'{f}: {e}')
          for f in [Path('data/journey_runs.json'), Path('data/business_daily_history.json')]:
              if not f.exists():
                  continue
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('::error::Refusing to push invalid JSON:\n' + '\n'.join(bad))
              sys.exit(1)
          print('Journey JSON validated OK.')
          "

          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
